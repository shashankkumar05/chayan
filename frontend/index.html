<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Chayan - Analyze. Match. Get Selected.</title>
<link rel="icon" type="image/svg+xml" href="/chayan-logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;min-height:100vh;color:#0f172a;background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 45%,#312e81 100%) fixed}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;z-index:0;pointer-events:none;animation:float 14s ease-in-out infinite}
body::before{width:520px;height:520px;background:#7c3aed;top:-120px;left:-100px}
body::after{width:480px;height:480px;background:#ec4899;bottom:-140px;right:-100px;animation-delay:-7s}
#root{position:relative;z-index:1}
#root::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:24px 24px}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,40px)}}
.confetti{position:absolute;top:-30px;font-size:20px;animation:fall 2.6s ease-in forwards}@keyframes fall{to{transform:translateY(560px) rotate(360deg);opacity:0}}
</style></head>
<body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
